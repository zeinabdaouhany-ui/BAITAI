:root {
  --cream: #F4F1EA;
  --paper: #FBFAF6;
  --ink: #1A1A1F;
  --rule: #D8D2C5;

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; background: var(--cream); color: var(--ink); }
body { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; outline: none; }

.font-display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
.font-body    { font-family: 'DM Sans', system-ui, sans-serif; }
.font-mono    { font-family: 'JetBrains Mono', monospace; }

/* Layout */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.header { border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 20; background: var(--cream); }

.text-right { text-align: right; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-text-1 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.brand-text-2 { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--mute); margin-top: 2px; }

.phase-btn { display: flex; align-items: center; gap: 12px; padding: 8px 16px; white-space: nowrap; transition: all 0.2s; border: 1px solid var(--rule); background: transparent; color: var(--ink); }
.phase-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.phase-btn-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--mute); }
.phase-btn.active .phase-btn-num { color: var(--gold-t); }
.phase-btn-label { font-size: 12px; font-weight: 500; letter-spacing: -0.01em; }

main.content { padding: 40px 32px; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }

footer.foot { border-top: 1px solid var(--rule); margin-top: 32px; padding: 24px 32px; }
.foot-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; }
.mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--mute); }

.field-hint { font-size: 11px; margin-top: 4px; color: var(--mute); }
.input-line { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--rule); font-size: 14px; padding: 8px 0; color: var(--ink); transition: border-color 0.2s; }
.input-line:focus { border-color: var(--ink); }
.input-area { width: 100%; background: transparent; border: 1px solid var(--rule); font-size: 14px; padding: 12px; color: var(--ink); resize: vertical; transition: border-color 0.2s; }

select.input-line { cursor: pointer; }

.btn { font-weight: 500; letter-spacing: -0.01em; transition: all 0.2s; cursor: pointer; }
.btn-primary { background: var(--ink); color: var(--cream); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }

.btn-sm { font-size: 11px; padding: 6px 12px; }
.btn-md { font-size: 13px; padding: 10px 20px; }

.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.gap-6 { gap: 24px; }
.gap-8 { gap: 32px; }

.gap-y-6 { row-gap: 24px; }

.col-span-3 { grid-column: span 3; }
.col-span-4 { grid-column: span 4; }
.col-span-5 { grid-column: span 5; }

// ─── Storage helpers ──────────────────────────────────────────────────────
// In-memory cache as a session-level fallback when window.storage is unavailable
const __mem = {};
async function safeGet(key) {
  try { if (window.storage) { const r = await window.storage.get(key); return r ? r.value : null; } }
  catch (e) {}
  return __mem[key] || null;
}
async function safeSet(key, value) {
  try { if (window.storage) { await window.storage.set(key, value); return true; } }
  catch (e) {}
  __mem[key] = value;
  return true;
}
async function safeList(prefix) {
  try { if (window.storage) { const r = await window.storage.list(prefix); return r ? r.keys : []; } }
  catch (e) {}
  return Object.keys(__mem).filter(k => k.startsWith(prefix));
}
async function safeDelete(key) {
  try { if (window.storage) { await window.storage.delete(key); return true; } }
  catch (e) {}
  delete __mem[key];
  return true;
}

const aiactRiskTier = (a) => {
  const anyTrue = (obj) => Object.values(obj).some(v => v === true);
  if (anyTrue(a.prohibited)) return { tier: "Prohibited", color: "#5C1A1A", desc: "Article 5: cannot be deployed under any circumstance." };
  if (anyTrue(a.highrisk))   return { tier: "High-risk",  color: C.ox,    desc: "Annex III: full provider/deployer obligations apply." };
  if (anyTrue(a.transparency)) return { tier: "Limited risk", color: C.amber, desc: "Article 50: transparency obligations apply." };
  return { tier: "Minimal risk", color: C.green, desc: "No specific AI Act obligations beyond GPAI rules where applicable." };
};

const scoreEA = (ea) => {
  const layers = ["business", "application", "data", "technology"];
  const totals = layers.map(l => {
    const items = EA_LAYERS.find(L => L.id === l).items;
    const checked = items.filter(it => ea[l][it.id] === true).length;
    return Math.round((checked / items.length) * 100);
  });
  return {
    business: totals[0], application: totals[1], data: totals[2], technology: totals[3],
    overall: Math.round(totals.reduce((a, b) => a + b, 0) / totals.length),
  };
};

const scoreCompliance = (compliance) => {
  const applicable = REGULATIONS.filter(r => compliance[r.id].applicable === "Yes");
  if (!applicable.length) return 0;
  const compliant = applicable.filter(r => compliance[r.id].status === "Compliant").length;
  return Math.round((compliant / applicable.length) * 100);
};

const scoreBA = (ba) => {
  let s = 0;
  s += Math.min(25, Math.round((ba.stakeholders.length / 3) * 25));
  s += Math.min(25, Math.round((ba.frs.length / 5) * 25));
  s += Math.min(25, Math.round((ba.nfrs.length / 5) * 25));
  s += Math.min(25, Math.round((ba.stories.length / 3) * 25));
  return Math.min(s, 100);
};

const scoreAIAct = (aiact) => {
  const tier = aiactRiskTier(aiact);
  if (tier.tier === "Prohibited") return 0;
  if (tier.tier === "Minimal risk") return 100;
  const required = tier.tier === "High-risk"
    ? AIACT_DEPLOYER_OBLIGATIONS
    : AIACT_DEPLOYER_OBLIGATIONS.filter(o => ["o13", "o50"].includes(o.id));
  if (!required.length) return 100;
  const done = required.filter(o => aiact.obligations[o.id] === true).length;
  return Math.round((done / required.length) * 100);
};

const recommendation = (overall, aiactTier) => {
  if (aiactTier === "Prohibited") return { label: "STOP", color: "#5C1A1A", text: "Use case falls under AI Act Article 5 prohibitions. Do not proceed." };
  if (overall >= 80) return { label: "GO", color: C.green, text: "Project demonstrates strong governance maturity. Proceed to delivery." };
  if (overall >= 55) return { label: "CONDITIONAL GO", color: C.amber, text: "Proceed with conditions. Close gaps before key milestones." };
  return { label: "NO-GO", color: C.ox, text: "Insufficient governance maturity. Remediate before stage gate." };
};

// ─── SVG charts (custom, no recharts dependency) ──────────────────────────
const RadarChart = ({ data, size = 280 }) => {
  const cx = size / 2, cy = size / 2;
  const r = size * 0.36;
  const n = data.length;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;

  // Grid rings
  const rings = [0.25, 0.5, 0.75, 1.0];
  const polygonPts = (pct) => data.map((_, i) => {
    const a = angle(i);
    return `${cx + Math.cos(a) * r * pct},${cy + Math.sin(a) * r * pct}`;
  }).join(" ");

  // Data polygon
  const dataPts = data.map((d, i) => {
    const a = angle(i);
    const v = (d.value || 0) / 100;
    return `${cx + Math.cos(a) * r * v},${cy + Math.sin(a) * r * v}`;
  }).join(" ");

  return (
    <svg width="100%" height={size} viewBox={`0 0 ${size} ${size}`}>
      {rings.map((p, i) => (
        <polygon key={i} points={polygonPts(p)} fill="none" stroke={C.rule} strokeWidth="1" />
      ))}
      {data.map((_, i) => {
        const a = angle(i);
        return <line key={i} x1={cx} y1={cy} x2={cx + Math.cos(a) * r} y2={cy + Math.sin(a) * r} stroke={C.rule} strokeWidth="1" />;
      })}
      <polygon points={dataPts} fill={C.navy} fillOpacity="0.25" stroke={C.navy} strokeWidth="2" />
      {data.map((d, i) => {
        const a = angle(i);
        const v = (d.value || 0) / 100;
        return <circle key={i} cx={cx + Math.cos(a) * r * v} cy={cy + Math.sin(a) * r * v} r="3" fill={C.navy} />;
      })}
      {data.map((d, i) => {
        const a = angle(i);
        const lx = cx + Math.cos(a) * (r + 22);
        const ly = cy + Math.sin(a) * (r + 22);
        return <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" className="chart-axis-label">{d.axis}</text>;
      })}
    </svg>
  );
};

const HBarChart = ({ data, height = 280 }) => {
  const margin = { left: 150, right: 24, top: 8, bottom: 24 };
  const innerH = height - margin.top - margin.bottom;
  const barH = innerH / data.length - 6;
  return (
    <svg width="100%" height={height} viewBox={`0 0 600 ${height}`} preserveAspectRatio="none">
      {/* X axis ticks */}
      {[0, 25, 50, 75, 100].map((t, i) => {
        const x = margin.left + ((600 - margin.left - margin.right) * t) / 100;
        return (
          <g key={i}>
            <line x1={x} y1={margin.top} x2={x} y2={height - margin.bottom} stroke={C.rule} strokeWidth="1" />
            <text x={x} y={height - 8} textAnchor="middle" className="chart-tick-label">{t}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const y = margin.top + i * (barH + 6) + 3;
        const w = ((600 - margin.left - margin.right) * d.value) / 100;
        return (
          <g key={i}>
            <text x={margin.left - 8} y={y + barH / 2 + 4} textAnchor="end" className="chart-axis-label">{d.name}</text>
            <rect x={margin.left} y={y} width={600 - margin.left - margin.right} height={barH} fill="rgba(0,0,0,0.04)" />
            <rect x={margin.left} y={y} width={w} height={barH} fill={d.color} />
          </g>
        );
      })}
    </svg>
  );
};

          <div key={i} className="grid grid-12 gap-3" style={{ marginBottom: 8, alignItems: "center" }}>
            <input style={{ ...inlineInput, gridColumn: "span 4" }} placeholder="Name / function" value={s.name} onChange={e => updateItem("stakeholders", i, "name", e.target.value)} />
            <input style={{ ...inlineInput, gridColumn: "span 4" }} placeholder="Role / department" value={s.role} onChange={e => updateItem("stakeholders", i, "role", e.target.value)} />
            <select style={{ ...inlineInput, gridColumn: "span 3", fontFamily: "JetBrains Mono, monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em" }}
              value={s.raci} onChange={e => updateItem("stakeholders", i, "raci", e.target.value)}>
              <option>Responsible</option><option>Accountable</option><option>Consulted</option><option>Informed</option>
            </select>
            <button style={{ ...removeBtn, gridColumn: "span 1" }} onClick={() => removeItem("stakeholders", i)}>Remove</button>
          </div>
        ))}
      </div>

      {/* Functional reqs */}
      <div style={{ marginBottom: 48 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 16 }}>
          <div className="font-display" style={{ fontSize: 20, fontWeight: 500 }}>Functional Requirements</div>
          <Btn small variant="ghost" onClick={() => addItem("frs", () => ({ id: `FR-${a.ba.frs.length + 1}`, text: "", priority: "Must" }))}>+ Add FR</Btn>
        </div>
        {a.ba.frs.map((f, i) => (
          <div key={i} className="grid grid-12 gap-3" style={{ marginBottom: 8, alignItems: "center" }}>
            <input style={{ ...inlineInput, gridColumn: "span 2", fontFamily: "JetBrains Mono, monospace", fontSize: 12 }} value={f.id} onChange={e => updateItem("frs", i, "id", e.target.value)} />
            <input style={{ ...inlineInput, gridColumn: "span 7" }} placeholder="The system shall..." value={f.text} onChange={e => updateItem("frs", i, "text", e.target.value)} />
            <select style={{ ...inlineInput, gridColumn: "span 2", fontFamily: "JetBrains Mono, monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em" }}
              value={f.priority} onChange={e => updateItem("frs", i, "priority", e.target.value)}>
              <option>Must</option><option>Should</option><option>Could</option><option>Won't</option>
            </select>
            <button style={{ ...removeBtn, gridColumn: "span 1" }} onClick={() => removeItem("frs", i)}>Remove</button>
          </div>
        ))}
      </div>

      {/* Non-functional reqs */}
      <div style={{ marginBottom: 48 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 16 }}>
          <div className="font-display" style={{ fontSize: 20, fontWeight: 500 }}>Non-Functional Requirements</div>
          <Btn small variant="ghost" onClick={() => addItem("nfrs", () => ({ id: `NFR-${a.ba.nfrs.length + 1}`, category: "Performance", text: "" }))}>+ Add NFR</Btn>
        </div>
        {a.ba.nfrs.map((n, i) => (
          <div key={i} className="grid grid-12 gap-3" style={{ marginBottom: 8, alignItems: "center" }}>
            <input style={{ ...inlineInput, gridColumn: "span 2", fontFamily: "JetBrains Mono, monospace", fontSize: 12 }} value={n.id} onChange={e => updateItem("nfrs", i, "id", e.target.value)} />
            <select style={{ ...inlineInput, gridColumn: "span 2", fontFamily: "JetBrains Mono, monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.12em" }}
              value={n.category} onChange={e => updateItem("nfrs", i, "category", e.target.value)}>
              {["Performance", "Security", "Privacy", "Explainability", "Fairness", "Resilience", "Scalability", "Usability", "Auditability"].map(c => <option key={c}>{c}</option>)}
            </select>
            <input style={{ ...inlineInput, gridColumn: "span 7" }} placeholder="Threshold or target..." value={n.text} onChange={e => updateItem("nfrs", i, "text", e.target.value)} />
            <button style={{ ...removeBtn, gridColumn: "span 1" }} onClick={() => removeItem("nfrs", i)}>Remove</button>
          </div>
        ))}
      </div>

      {/* User stories */}
      <div>
        <div className="flex items-center justify-between" style={{ marginBottom: 16 }}>
          <div className="font-display" style={{ fontSize: 20, fontWeight: 500 }}>User Stories</div>
          <Btn small variant="ghost" onClick={() => addItem("stories", () => ({ id: `US-${a.ba.stories.length + 1}`, persona: "", want: "", value: "", ac: "" }))}>+ Add story</Btn>
        </div>
        {a.ba.stories.map((s, i) => (
          <div key={i} className="card-tight" style={{ marginBottom: 12 }}>
            <div className="flex justify-between items-center" style={{ marginBottom: 12 }}>
              <input style={{ ...inlineInput, fontFamily: "JetBrains Mono, monospace", fontSize: 12, width: 80 }} value={s.id} onChange={e => updateItem("stories", i, "id", e.target.value)} />
              <button style={removeBtn} onClick={() => removeItem("stories", i)}>Remove</button>
            </div>
            <div style={{ fontSize: 13, color: C.ink, lineHeight: 2 }}>
              <span style={{ color: C.mute }}>As a </span>
              <input style={{ ...inlineInput, display: "inline-block", width: "auto", minWidth: 120, padding: "0 4px", margin: "0 4px" }} placeholder="persona" value={s.persona} onChange={e => updateItem("stories", i, "persona", e.target.value)} />
              <span style={{ color: C.mute }}>, I want </span>
              <input style={{ ...inlineInput, display: "inline-block", width: "auto", minWidth: 200, padding: "0 4px", margin: "0 4px" }} placeholder="capability" value={s.want} onChange={e => updateItem("stories", i, "want", e.target.value)} />
              <span style={{ color: C.mute }}>, so that </span>
              <input style={{ ...inlineInput, display: "inline-block", width: "auto", minWidth: 200, padding: "0 4px", margin: "0 4px" }} placeholder="business value" value={s.value} onChange={e => updateItem("stories", i, "value", e.target.value)} />
            </div>
            <div style={{ marginTop: 12 }}>
              <Field label="Acceptance Criteria">
                <textarea className="input-area" rows="2" value={s.ac} onChange={e => updateItem("stories", i, "ac", e.target.value)} placeholder="Given... When... Then..." />
              </Field>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

// ─── Phase: Dashboard ─────────────────────────────────────────────────────
const PhaseDashboard = ({ a }) => {
  const aiTier = aiactRiskTier(a.aiact);
  const sAI = scoreAIAct(a.aiact);
  const sEA = scoreEA(a.ea);
  const sComp = scoreCompliance(a.compliance);
  const sBA = scoreBA(a.ba);
  const overall = Math.round((sAI + sEA.overall + sComp + sBA) / 4);
  const rec = recommendation(overall, aiTier.tier);

  const radarData = [
    { axis: "AI Act", value: sAI },
    { axis: "Architecture", value: sEA.overall },
    { axis: "Compliance", value: sComp },
    { axis: "BA", value: sBA },
    { axis: "Risk Posture", value: aiTier.tier === "Prohibited" ? 0 : aiTier.tier === "High-risk" ? sAI : 100 },
  ];

  const compBars = REGULATIONS.map(r => ({
    name: r.short,
    value: a.compliance[r.id].status === "Compliant" ? 100 : a.compliance[r.id].status === "In progress" ? 50 : a.compliance[r.id].status === "Gap" ? 20 : 0,
    color: r.color,
  }));

  const actions = [];
  if (aiTier.tier === "High-risk") {
    AIACT_DEPLOYER_OBLIGATIONS.forEach(o => { if (!a.aiact.obligations[o.id]) actions.push({ priority: "P1", text: `AI Act ${o.art}: ${o.label}` }); });
  }
  REGULATIONS.forEach(r => {
    if (a.compliance[r.id].applicable === "Yes" && a.compliance[r.id].status === "Gap") actions.push({ priority: "P1", text: `Close compliance gap: ${r.short}` });
    if (a.compliance[r.id].applicable === "Yes" && a.compliance[r.id].status === "In progress") actions.push({ priority: "P2", text: `Complete compliance work: ${r.short}` });
  });
  EA_LAYERS.forEach(L => { L.items.forEach(it => { if (!a.ea[L.id][it.id]) actions.push({ priority: "P3", text: `Architecture (${L.title}): ${it.q}` }); }); });
  if (a.ba.stakeholders.length < 3) actions.push({ priority: "P2", text: "Complete stakeholder map (minimum three)" });
  if (a.ba.frs.length < 5) actions.push({ priority: "P2", text: "Document at least five functional requirements" });
  if (a.ba.nfrs.length < 5) actions.push({ priority: "P2", text: "Define at least five non-functional requirements" });
  if (a.ba.stories.length < 3) actions.push({ priority: "P3", text: "Draft at least three user stories with acceptance criteria" });

  const top = actions.sort((x, y) => x.priority.localeCompare(y.priority)).slice(0, 8);

  return (
    <div className="fade-in">
      <SectionHeader eyebrow="Phase 06" title="Executive Dashboard"
        sub="The one-page view for steering committees: where the project stands, what is blocking it, what to do next." />

      {/* Headline */}
      <div className="card" style={{ borderWidth: 2, borderColor: rec.color, marginBottom: 32 }}>
        <div className="grid grid-12 gap-8" style={{ alignItems: "center" }}>
          <div style={{ gridColumn: "span 4" }}>
            <div className="uppercase-tag text-mute" style={{ marginBottom: 8 }}>Recommendation</div>
            <div className="font-display" style={{ fontSize: 44, fontWeight: 600, lineHeight: 1, color: rec.color }}>{rec.label}</div>
            <div style={{ fontSize: 13, marginTop: 12 }}>{rec.text}</div>
          </div>
          <div style={{ gridColumn: "span 3" }}>
            <div className="uppercase-tag text-mute" style={{ marginBottom: 8 }}>Overall Readiness</div>
            <div className="font-display" style={{ fontSize: 64, fontWeight: 600, lineHeight: 1 }}>{overall}<span style={{ fontSize: 24, color: C.mute }}>%</span></div>
          </div>
          <div style={{ gridColumn: "span 5" }}>
            <div className="uppercase-tag text-mute" style={{ marginBottom: 8 }}>AI Act Risk Tier</div>
            <div className="font-display" style={{ fontSize: 28, fontWeight: 600, lineHeight: 1, marginBottom: 8, color: aiTier.color }}>{aiTier.tier}</div>
            <div style={{ fontSize: 12, color: C.mute }}>{aiTier.desc}</div>
          </div>
        </div>
      </div>

      {/* Charts */}
      <div className="grid grid-2 gap-8" style={{ marginBottom: 32 }}>
        <div className="card">
          <div className="uppercase-mini text-mute" style={{ marginBottom: 4 }}>Multi-axis assessment</div>
          <div className="font-display" style={{ fontSize: 18, fontWeight: 500, marginBottom: 16 }}>Governance Profile</div>
          <RadarChart data={radarData} />
        </div>
        <div className="card">
          <div className="uppercase-mini text-mute" style={{ marginBottom: 4 }}>By regulation</div>
          <div className="font-display" style={{ fontSize: 18, fontWeight: 500, marginBottom: 16 }}>Compliance Heat</div>
          <HBarChart data={compBars} />
        </div>
      </div>

      {/* Score grid */}
      <div className="grid grid-4 gap-3" style={{ marginBottom: 32 }}>
        {[
          { label: "AI Act Maturity", val: sAI, color: C.navy },
          { label: "Architecture Fit", val: sEA.overall, color: C.gold },
          { label: "Compliance Coverage", val: sComp, color: C.ox },
          { label: "Business Analysis", val: sBA, color: C.green },
        ].map((s, i) => (
          <div key={i} className="card-tight">
            <div className="uppercase-mini" style={{ color: s.color, marginBottom: 8 }}>{s.label}</div>
            <div className="font-display" style={{ fontSize: 34, fontWeight: 500, lineHeight: 1 }}>{s.val}<span style={{ fontSize: 14, color: C.mute }}>%</span></div>
            <div className="h-1" style={{ marginTop: 8 }}>
              <div style={{ background: s.color, width: `${s.val}%` }} />
            </div>
          </div>
        ))}
      </div>

      {/* Actions */}
      <div className="card">
        <div className="font-display" style={{ fontSize: 20, fontWeight: 500, marginBottom: 16 }}>Top Actions to Close Gaps</div>
        {top.length === 0 ? (
          <div style={{ fontSize: 14, color: C.mute }}>No outstanding gaps detected. Excellent posture.</div>
        ) : (
          <ol style={{ listStyle: "none" }}>
            {top.map((act, i) => (
              <li key={i} className="grid grid-12 gap-3" style={{ alignItems: "baseline", marginBottom: 12 }}>
                <div style={{
                  gridColumn: "span 1",
                  fontFamily: "JetBrains Mono, monospace", fontSize: 10, textTransform: "uppercase", letterSpacing: "0.14em",
                  padding: "2px 8px", color: C.cream, width: "fit-content",
                  background: act.priority === "P1" ? C.ox : act.priority === "P2" ? C.amber : C.mute,
                }}>{act.priority}</div>
                <div style={{ gridColumn: "span 11", fontSize: 13 }}>{act.text}</div>
              </li>
            ))}
          </ol>
        )}
      </div>
    </div>
  );
};

// ─── Root ─────────────────────────────────────────────────────────────────
function App() {
  const [a, setA] = useState(blankAssessment());
  const [phase, setPhase] = useState("intake");
  const [savedList, setSavedList] = useState([]);
  const [showSaved, setShowSaved] = useState(false);
  const [toast, setToast] = useState("");

  const update = (path, value) => {
    setA(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const parts = path.split(".");
      let cur = next;
      for (let i = 0; i < parts.length - 1; i++) {
        if (cur[parts[i]] === undefined) cur[parts[i]] = {};
        cur = cur[parts[i]];
      }
      cur[parts[parts.length - 1]] = value;
      return next;
    });
  };

  const refreshList = async () => {
    const keys = await safeList("assessment:");
    const items = [];
    for (const k of keys) {
      const v = await safeGet(k);
      if (v) {
        try {
          const parsed = JSON.parse(v);
          items.push({ key: k, name: parsed.meta?.name || "(untitled)", date: parsed.meta?.createdAt });
        } catch (e) {}
      }
    }
    setSavedList(items.sort((x, y) => (y.date || "").localeCompare(x.date || "")));
  };

  useEffect(() => { refreshList(); }, []);

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  const save = async () => {
    if (!a.meta.name) { flash("Please give the project a name first."); return; }
    const ok = await safeSet(`assessment:${a.id}`, JSON.stringify(a));
    if (ok) { flash("Saved."); refreshList(); } else flash("Storage unavailable in this session.");
  };

  const load = async (key) => {
    const v = await safeGet(key);
    if (v) { try { setA(JSON.parse(v)); setShowSaved(false); flash("Loaded."); } catch (e) { flash("Could not parse."); } }
  };

  const remove = async (key) => { await safeDelete(key); refreshList(); };
  const newOne = () => { setA(blankAssessment()); setPhase("intake"); };

  const exportJson = () => {
    const blob = new Blob([JSON.stringify(a, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `aegis_${a.meta.name || "assessment"}.json`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const tier = aiactRiskTier(a.aiact);
  const sAI = scoreAIAct(a.aiact);
  const sEA = scoreEA(a.ea).overall;
  const sComp = scoreCompliance(a.compliance);
  const sBA = scoreBA(a.ba);
  const overall = Math.round((sAI + sEA + sComp + sBA) / 4);

  const renderPhase = () => {
    switch (phase) {
      case "intake": return <PhaseIntake a={a} update={update} />;
      case "aiact": return <PhaseAIAct a={a} update={update} />;
      case "ea": return <PhaseEA a={a} update={update} />;
      case "compliance": return <PhaseCompliance a={a} update={update} />;
      case "ba": return <PhaseBA a={a} update={update} />;
      case "dashboard": return <PhaseDashboard a={a} />;
      default: return null;
    }
  };

  const phaseIdx = PHASES.findIndex(p => p.id === phase);

  return (
    <div className="app">
      <header className="header">
        <div className="header-row">
          <Brand />
          <div className="header-meta" style={{ display: window.innerWidth > 1100 ? "flex" : "none" }}>
            <div className="text-right">
              <div className="uppercase-mini text-mute">Project</div>
              <div className="font-display" style={{ fontSize: 14, fontWeight: 500 }}>{a.meta.name || "Untitled assessment"}</div>
            </div>
            <div className="divider-v" />
            <div className="text-right">
              <div className="uppercase-mini text-mute">Risk Tier</div>
              <div className="font-display" style={{ fontSize: 14, fontWeight: 500, color: tier.color }}>{tier.tier}</div>
            </div>
            <div className="divider-v" />
            <div className="text-right">
              <div className="uppercase-mini text-mute">Readiness</div>
              <div className="font-display" style={{ fontSize: 14, fontWeight: 500 }}>{overall}%</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <Btn small variant="ghost" onClick={() => setShowSaved(true)}>Saved ({savedList.length})</Btn>
            <Btn small variant="ghost" onClick={newOne}>New</Btn>
            <Btn small variant="ghost" onClick={exportJson}>Export</Btn>
            <Btn small onClick={save}>Save</Btn>
          </div>
        </div>
        <div className="phase-nav">
          {PHASES.map(p => (
            <button key={p.id} className={`phase-btn ${p.id === phase ? "active" : ""}`} onClick={() => setPhase(p.id)}>
              <span className="phase-btn-num">{p.n}</span>
              <span className="phase-btn-label">{p.title}</span>
            </button>
          ))}
        </div>
      </header>

      <main className="content">
        {renderPhase()}
        <div className="nav-end">
          <button className="nav-link" disabled={phaseIdx === 0} onClick={() => setPhase(PHASES[phaseIdx - 1].id)}>
            ← Previous{phaseIdx > 0 ? `: ${PHASES[phaseIdx - 1].title}` : ""}
          </button>
          <button className="nav-link" disabled={phaseIdx === PHASES.length - 1} onClick={() => setPhase(PHASES[phaseIdx + 1].id)}>
            {phaseIdx < PHASES.length - 1 ? `Next: ${PHASES[phaseIdx + 1].title}` : ""} →
          </button>
        </div>
      </main>

      <footer className="foot">
        <div className="foot-inner">
          <div className="mono-tag">AEGIS · Built for KBC Bank & Insurance · AI Project Governance</div>
          <div className="mono-tag">AI Act · GDPR · DORA · NIS2 · PSD2 · eIDAS · Data Act · DGA · EBA Guidelines</div>
        </div>
      </footer>

      {showSaved && (
        <div className="drawer-bg" onClick={() => setShowSaved(false)}>
          <div className="drawer" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center" style={{ marginBottom: 24 }}>
              <div className="font-display" style={{ fontSize: 24, fontWeight: 500 }}>Saved Assessments</div>
              <button className="mono-tag" style={{ cursor: "pointer", border: "none", background: "none" }} onClick={() => setShowSaved(false)}>Close</button>
            </div>
            {savedList.length === 0 ? (
              <div style={{ fontSize: 13, color: C.mute }}>Nothing saved yet. Hit Save in the top bar to create a record.</div>
            ) : savedList.map(item => (
              <div key={item.key} className="flex justify-between items-center" style={{ borderBottom: `1px solid ${C.rule}`, padding: "12px 0" }}>
                <div>
                  <div className="font-display" style={{ fontSize: 15, fontWeight: 500 }}>{item.name}</div>
                  <div className="uppercase-mini text-mute">{item.date ? new Date(item.date).toLocaleString() : ""}</div>
                </div>
                <div className="flex gap-2">
                  <Btn small variant="ghost" onClick={() => load(item.key)}>Load</Btn>
                  <Btn small variant="ghost" onClick={() => remove(item.key)}>Delete</Btn>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
